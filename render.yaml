# Render.com Blueprint — connect this repo in Render and it deploys from the Dockerfile.
# Chromium + multi-minute survey walks need real RAM, so use a paid instance (>=2 GB),
# not the free tier (512 MB will OOM during a walk).
services:
  - type: web
    name: survey-qa-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # 2 GB RAM; bump to pro for headroom
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set the (rotated) key as a secret in the Render dashboard
      - key: APP_PASSWORD
        sync: false          # set a password to gate the public URL (omit to leave open)
